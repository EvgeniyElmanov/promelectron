services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: promelectron
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data


  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/promelectron
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production-minimum-32-chars
      ALGORITHM: HS256
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:5173
      API_BASE_URL: http://localhost:8000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: promelectron-uploads
      MINIO_SECURE: "false"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_TEST_MODE: ${YOOKASSA_TEST_MODE:-true}
      YOOKASSA_CAPTURE_AUTO: ${YOOKASSA_CAPTURE_AUTO:-true}
      YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-1}
      YOOKASSA_TAX_SYSTEM_CODE: ${YOOKASSA_TAX_SYSTEM_CODE:-1}
      YOOKASSA_RECEIPT_ENABLED: ${YOOKASSA_RECEIPT_ENABLED:-false}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      CDEK_ACCOUNT: ${CDEK_ACCOUNT:-wqGwiQx0gg8mLtiEKsUinjVSICCjtTEP}
      CDEK_SECURE: ${CDEK_SECURE:-RmAmgvSgSl1yirlz9QupbzOJVqhCxcP5}
      CDEK_API_URL: ${CDEK_API_URL:-https://api.edu.cdek.ru}
      CDEK_TEST_MODE: ${CDEK_TEST_MODE:-true}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/promelectron
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production-minimum-32-chars
      ALGORITHM: HS256
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:5173
      API_BASE_URL: http://localhost:8000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: promelectron-uploads
      MINIO_SECURE: "false"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_TEST_MODE: ${YOOKASSA_TEST_MODE:-true}
      YOOKASSA_CAPTURE_AUTO: ${YOOKASSA_CAPTURE_AUTO:-true}
      YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-1}
      YOOKASSA_TAX_SYSTEM_CODE: ${YOOKASSA_TAX_SYSTEM_CODE:-1}
      YOOKASSA_RECEIPT_ENABLED: ${YOOKASSA_RECEIPT_ENABLED:-false}
      CDEK_ACCOUNT: ${CDEK_ACCOUNT:-wqGwiQx0gg8mLtiEKsUinjVSICCjtTEP}
      CDEK_SECURE: ${CDEK_SECURE:-RmAmgvSgSl1yirlz9QupbzOJVqhCxcP5}
      CDEK_API_URL: ${CDEK_API_URL:-https://api.edu.cdek.ru}
      CDEK_TEST_MODE: ${CDEK_TEST_MODE:-true}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A src.app.workers.celery_app worker --loglevel=info --concurrency=2

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/promelectron
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production-minimum-32-chars
      ALGORITHM: HS256
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:5173
      API_BASE_URL: http://localhost:8000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: promelectron-uploads
      MINIO_SECURE: "false"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_TEST_MODE: ${YOOKASSA_TEST_MODE:-true}
      YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-1}
      YOOKASSA_TAX_SYSTEM_CODE: ${YOOKASSA_TAX_SYSTEM_CODE:-1}
      YOOKASSA_RECEIPT_ENABLED: ${YOOKASSA_RECEIPT_ENABLED:-false}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      CDEK_ACCOUNT: ${CDEK_ACCOUNT:-wqGwiQx0gg8mLtiEKsUinjVSICCjtTEP}
      CDEK_SECURE: ${CDEK_SECURE:-RmAmgvSgSl1yirlz9QupbzOJVqhCxcP5}
      CDEK_API_URL: ${CDEK_API_URL:-https://api.edu.cdek.ru}
      CDEK_TEST_MODE: ${CDEK_TEST_MODE:-true}
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A src.app.workers.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
  minio_data:
