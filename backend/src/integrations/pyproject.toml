[project]
name = "promelectron"
version = "0.1.0"
description = "Ozon Marketplace collector service for Promelectron"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "apscheduler>=3.10",
    "clickhouse-connect>=0.8",
    "pydantic-settings>=2.5",
    "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector"]

[project.scripts]
collector = "collector.main:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.uv]
index-url = "https://pypi.org/simple/"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
