[project]
name = "onec-mock-server"
version = "0.1.0"
description = "1C:UNF OData mock server for Promelectron (OData pull over onec schema dump)"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
cache_dir = "/tmp/pytest-cache-onec-mock"
