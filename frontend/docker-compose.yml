services:
  frontend:
    image: mcr.microsoft.com/playwright:v1.61.0-jammy
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_API=http://api:8000
      - API_URL=http://api:8000
      - BASE_URL=http://frontend:5173
      - VITE_YANDEX_MAPS_API_KEY=test-yandex-maps-api-key
    volumes:
      - ../frontend:/app
    command: sh -c "npm install --silent && npm run dev -- --host 0.0.0.0"

  frontend-test:
    image: node:20-slim
    working_dir: /app
    environment:
      - CI=true
      - HOME=/app
    volumes:
      - ../frontend:/app
    command: sh -c "npm ci && npm test"
