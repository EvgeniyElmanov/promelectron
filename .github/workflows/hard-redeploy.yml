name: Hard Redeploy Test

on:
  workflow_dispatch:

env:
  REGISTRY: harbor.kubeadm.ru
  API_IMAGE: harbor.kubeadm.ru/promelectron/myshop-api
  FRONTEND_IMAGE: harbor.kubeadm.ru/promelectron/myshop-frontend
  KUBECONFIG_PATH: ${{ vars.KUBECONFIG_PATH }}

jobs:
  hard-redeploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.REGISTRY }} \
            -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: Hard Redeploy
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          bash scripts/hard_redeploy_test.sh | tee /tmp/redeploy.log

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redeploy-log
          path: /tmp/redeploy.log
          retention-days: 3
