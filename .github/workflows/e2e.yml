name: E2E & Smoke Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        type: choice
        options:
          - test
          - prod
        default: test
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

env:
  # YooKassa test credentials for E2E (test card 5555 5555 5555 4444)
  YOOKASSA_SHOP_ID: ${{ vars.YOOKASSA_SHOP_ID }}
  YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
  YOOKASSA_TEST_MODE: ${{ vars.YOOKASSA_TEST_MODE || 'true' }}

jobs:
  smoke:
    runs-on: self-hosted
    steps:
      - name: Set URLs
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "API_URL=https://api.promelectron.aidrivencode.ru" >> $GITHUB_ENV
            echo "FRONTEND_URL=https://promelectron.aidrivencode.ru" >> $GITHUB_ENV
          else
            echo "API_URL=https://api.promelectron-test.aidrivencode.ru" >> $GITHUB_ENV
            echo "FRONTEND_URL=https://promelectron-test.aidrivencode.ru" >> $GITHUB_ENV
          fi

      - name: API health check
        run: |
          curl -sf "${{ env.API_URL }}/health" | grep -q '"status"'
          echo "API OK"

      - name: Frontend reachable
        run: |
          curl -sf -o /dev/null "${{ env.FRONTEND_URL }}"
          echo "Frontend OK"

      - name: YooKassa config check
        run: |
          echo "YooKassa test mode: ${{ env.YOOKASSA_TEST_MODE }}"
          echo "YooKassa shop ID: ${{ env.YOOKASSA_SHOP_ID }}"
          echo "YooKassa config OK"

  e2e:
    runs-on: self-hosted
    needs: smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set URLs
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "BASE_URL=https://promelectron.aidrivencode.ru" >> $GITHUB_ENV
            echo "API_URL=https://api.promelectron.aidrivencode.ru" >> $GITHUB_ENV
          else
            echo "BASE_URL=https://promelectron-test.aidrivencode.ru" >> $GITHUB_ENV
            echo "API_URL=https://api.promelectron-test.aidrivencode.ru" >> $GITHUB_ENV
          fi

      - name: Install Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install chromium

      - name: Run E2E tests
        run: |
          cd frontend
          BASE_URL="${{ env.BASE_URL }}" API_URL="${{ env.API_URL }}" \
            npx playwright test --reporter=html

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        # Не ронять прогон, если упёрлись в квоту artifact storage:
        # отчёт — вспомогательный артефакт, результат тестов важнее.
        continue-on-error: true
        with:
          name: playwright-report-${{ inputs.environment }}-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 5
