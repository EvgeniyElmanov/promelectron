name: Deploy to Kubernetes

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mocks/**'
      - 'infra/helm/**'
      - 'scripts/ci/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Окружение для деплоя'
        required: true
        type: choice
        options:
          - test
          - prod
          - all
        default: test

env:
  REGISTRY: harbor.kubeadm.ru
  API_IMAGE: harbor.kubeadm.ru/promelectron/promelectron-api
  FRONTEND_IMAGE: harbor.kubeadm.ru/promelectron/promelectron-frontend
  ONEC_MOCK_IMAGE: harbor.kubeadm.ru/promelectron/promelectron-onec-mock
  KUBECONFIG_PATH: ${{ vars.KUBECONFIG_PATH }}
  SOPS_VERSION: "3.9.4"

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.REGISTRY }} \
            -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: Ensure Harbor project exists
        run: |
          curl -sf -o /dev/null \
            -u "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" \
            -X POST "https://${{ env.REGISTRY }}/api/v2.0/projects" \
            -H "Content-Type: application/json" \
            -d '{"project_name":"promelectron","public":false}' || true

      - name: Build and push API image
        run: |
          docker build -f backend/Dockerfile \
            -t ${{ env.API_IMAGE }}:${{ github.sha }} \
            backend/
          docker push ${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend (test)
        if: github.event_name == 'push' || inputs.environment == 'test' || inputs.environment == 'all'
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_URL=https://api.promelectron-test.aidrivencode.ru \
            --build-arg VITE_YANDEX_MAPS_API_KEY=${{ secrets.YANDEX_MAPS_API_KEY }} \
            -t ${{ env.FRONTEND_IMAGE }}-test:${{ github.sha }} \
            frontend/
          docker push ${{ env.FRONTEND_IMAGE }}-test:${{ github.sha }}

      - name: Build and push 1C mock (test)
        if: github.event_name == 'push' || inputs.environment == 'test' || inputs.environment == 'all'
        run: |
          docker build -f mocks/onec-server/Dockerfile \
            -t ${{ env.ONEC_MOCK_IMAGE }}:${{ github.sha }} \
            mocks/onec-server/
          docker push ${{ env.ONEC_MOCK_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend (prod)
        if: inputs.environment == 'prod' || inputs.environment == 'all'
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_URL=https://api.promelectron.aidrivencode.ru \
            --build-arg VITE_YANDEX_MAPS_API_KEY=${{ secrets.YANDEX_MAPS_API_KEY }} \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            frontend/
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy-test:
    needs: build
    runs-on: self-hosted
    if: github.event_name == 'push' || inputs.environment == 'test' || inputs.environment == 'all'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sops
        run: |
          if ! command -v sops &>/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL -o "$HOME/.local/bin/sops" \
              "https://github.com/getsops/sops/releases/download/v${{ env.SOPS_VERSION }}/sops-v${{ env.SOPS_VERSION }}.linux.amd64"
            chmod +x "$HOME/.local/bin/sops"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Import GPG key
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf 'no-tty\npinentry-mode loopback\n' > "$GNUPGHOME/gpg.conf"
          printf 'allow-loopback-pinentry\nno-allow-external-cache\nallow-preset-passphrase\n' > "$GNUPGHOME/gpg-agent.conf"
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg-agent --daemon 2>/dev/null || true
          PRESET=$(command -v gpg-preset-passphrase 2>/dev/null \
            || find /usr/lib /usr/libexec -name gpg-preset-passphrase 2>/dev/null | head -1)
          gpg --with-keygrip --list-secret-keys \
            | awk '/Keygrip/{print $3}' \
            | while read -r grip; do
                printf '%s' "$GPG_PASSPHRASE" | "$PRESET" --preset "$grip"
              done
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Create Harbor imagePullSecret (test)
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create namespace promelectron-test --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry harborcred \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ secrets.HARBOR_USERNAME }} \
            --docker-password=${{ secrets.HARBOR_PASSWORD }} \
            --namespace promelectron-test \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to test
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
          # Optional GitHub Secrets overrides. Each is applied only when non-empty;
          # otherwise the committed baselines are used: SOPS (stage/test/secrets.yaml),
          # then stage/test/secret.yml (plain-text test-only secrets, e.g. ONEC_*).
          OVR_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          OVR_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          OVR_POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          OVR_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OVR_REDIS_URL: ${{ secrets.REDIS_URL }}
          OVR_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          OVR_ONEC_API_URL: ${{ secrets.ONEC_API_URL }}
          OVR_ONEC_LOGIN: ${{ secrets.ONEC_LOGIN }}
          OVR_ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
          OVR_ONEC_WEBHOOK_API_KEY: ${{ secrets.ONEC_WEBHOOK_API_KEY }}
          OVR_YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          OVR_YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          OVR_CDEK_ACCOUNT: ${{ secrets.CDEK_ACCOUNT }}
          OVR_CDEK_SECURE: ${{ secrets.CDEK_SECURE }}
          OVR_YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          OVR_YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          OVR_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          OVR_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OVR_MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          OVR_MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          OVR_MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          OVR_MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          OVR_SMTP_USER: ${{ secrets.SMTP_USER }}
          OVR_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          OVR_MEILISEARCH_MASTER_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}
        run: |
          set -euo pipefail
          # Build --set-string overrides for every secret whose GitHub Secret is non-empty.
          # SOPS provides the committed baseline; GitHub Secrets take precedence when present.
          OVERRIDES=()
          for key in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB DATABASE_URL REDIS_URL \
                     SECRET_KEY ONEC_API_URL ONEC_LOGIN ONEC_PASSWORD ONEC_WEBHOOK_API_KEY \
                     YOOKASSA_SHOP_ID YOOKASSA_SECRET_KEY CDEK_ACCOUNT CDEK_SECURE \
                     YANDEX_CLIENT_ID YANDEX_CLIENT_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
                     MINIO_ACCESS_KEY MINIO_SECRET_KEY MINIO_ROOT_USER MINIO_ROOT_PASSWORD \
                     SMTP_USER SMTP_PASSWORD MEILISEARCH_MASTER_KEY; do
            var="OVR_${key}"
            val="${!var:-}"
            [ -n "$val" ] || continue
            val="${val//\\/\\\\}"   # escape backslashes for helm strvals
            val="${val//,/\\,}"     # escape commas so they aren't treated as separators
            OVERRIDES+=(--set-string "env.secrets.${key}=${val}")
          done
          helm upgrade --install promelectron-test ./infra/helm \
            -f infra/helm/stage/test/values.yaml \
            -f <(sops -d infra/helm/stage/test/secrets.yaml) \
            -f infra/helm/stage/test/secret.yml \
            --set api.image=${{ env.API_IMAGE }}:${{ github.sha }} \
            --set frontend.image=${{ env.FRONTEND_IMAGE }}-test:${{ github.sha }} \
            --set onecMock.image=${{ env.ONEC_MOCK_IMAGE }}:${{ github.sha }} \
            "${OVERRIDES[@]}" \
            --namespace promelectron-test \
            --create-namespace \
            --wait \
            --wait-for-jobs \
            --timeout 10m
          kubectl rollout status deployment/promelectron-api -n promelectron-test --timeout=120s
          kubectl rollout status deployment/promelectron-frontend -n promelectron-test --timeout=120s

      - name: Debug deploy failure
        if: failure()
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          echo "=== Pods ==="
          kubectl get pods -n promelectron-test -o wide || true
          echo "=== Pod descriptions ==="
          kubectl describe pods -n promelectron-test || true
          echo "=== Events ==="
          kubectl get events -n promelectron-test --sort-by='.lastTimestamp' || true
          echo "=== API logs ==="
          kubectl logs -n promelectron-test -l app=promelectron-api --tail=200 || true
          echo "=== Frontend logs ==="
          kubectl logs -n promelectron-test -l app=promelectron-frontend --tail=200 || true
          echo "=== MinIO logs ==="
          kubectl logs -n promelectron-test -l app=promelectron-minio --tail=200 || true
          echo "=== PostgreSQL logs ==="
          kubectl logs -n promelectron-test -l app=promelectron-postgres --tail=200 || true
          echo "=== Redis logs ==="
          kubectl logs -n promelectron-test -l app=promelectron-redis --tail=200 || true

  # CI-сидинг каталога электротоваров на test-стенде (issue #147).
  # Только test-ветка: в prod-пайплайне job отсутствует (часть тройной защиты D-02).
  seed-test-catalog:
    needs: deploy-test
    runs-on: self-hosted
    if: github.event_name == 'push' || inputs.environment == 'test' || inputs.environment == 'all'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install httpx for image upload script
        run: |
          pip install --user "httpx==0.28.*"

      - name: Seed test catalog via 1C mock chain
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
          # F006/S001: секреты только из GitHub Secrets, хардкода в скриптах нет
          SEED_SECRET: ${{ secrets.SEED_SECRET }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SEED_SUPPLIER_PASSWORD: ${{ secrets.SEED_SUPPLIER_PASSWORD }}
        run: |
          bash scripts/ci/seed_test_catalog.sh

      - name: Debug seed failure
        if: failure()
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          echo "=== Pods ==="
          kubectl get pods -n promelectron-test -o wide || true
          echo "=== API logs ==="
          kubectl logs -n promelectron-test -l app=promelectron-api --tail=200 || true
          echo "=== Job worker logs ==="
          kubectl logs -n promelectron-test -l app=promelectron-job-worker --tail=200 || true
          echo "=== 1C mock logs ==="
          kubectl logs -n promelectron-test -l app=promelectron-onec-mock --tail=200 || true

  test-e2e:
    needs: [deploy-test, seed-test-catalog]
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
    with:
      environment: test

  deploy-prod:
    needs: [build, test-e2e]
    runs-on: self-hosted
    if: |
      always() &&
      (inputs.environment == 'prod' || inputs.environment == 'all') &&
      needs.build.result == 'success' &&
      (needs.test-e2e.result == 'success' || needs.test-e2e.result == 'skipped')
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sops
        run: |
          if ! command -v sops &>/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL -o "$HOME/.local/bin/sops" \
              "https://github.com/getsops/sops/releases/download/v${{ env.SOPS_VERSION }}/sops-v${{ env.SOPS_VERSION }}.linux.amd64"
            chmod +x "$HOME/.local/bin/sops"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Import GPG key
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf 'no-tty\npinentry-mode loopback\n' > "$GNUPGHOME/gpg.conf"
          printf 'allow-loopback-pinentry\nno-allow-external-cache\nallow-preset-passphrase\n' > "$GNUPGHOME/gpg-agent.conf"
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg-agent --daemon 2>/dev/null || true
          PRESET=$(command -v gpg-preset-passphrase 2>/dev/null \
            || find /usr/lib /usr/libexec -name gpg-preset-passphrase 2>/dev/null | head -1)
          gpg --with-keygrip --list-secret-keys \
            | awk '/Keygrip/{print $3}' \
            | while read -r grip; do
                printf '%s' "$GPG_PASSPHRASE" | "$PRESET" --preset "$grip"
              done
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Create Harbor imagePullSecret (prod)
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create namespace promelectron --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry harborcred \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ secrets.HARBOR_USERNAME }} \
            --docker-password=${{ secrets.HARBOR_PASSWORD }} \
            --namespace promelectron \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to prod
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
          # Optional GitHub Secrets overrides. Each is applied only when non-empty;
          # otherwise the SOPS-encrypted baseline (stage/prod/secrets.yaml) is used.
          OVR_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          OVR_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          OVR_POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          OVR_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OVR_REDIS_URL: ${{ secrets.REDIS_URL }}
          OVR_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          OVR_ONEC_API_URL: ${{ secrets.ONEC_API_URL }}
          OVR_ONEC_LOGIN: ${{ secrets.ONEC_LOGIN }}
          OVR_ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
          OVR_ONEC_WEBHOOK_API_KEY: ${{ secrets.ONEC_WEBHOOK_API_KEY }}
          OVR_YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          OVR_YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          OVR_CDEK_ACCOUNT: ${{ secrets.CDEK_ACCOUNT }}
          OVR_CDEK_SECURE: ${{ secrets.CDEK_SECURE }}
          OVR_YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          OVR_YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          OVR_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          OVR_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OVR_MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          OVR_MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          OVR_MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          OVR_MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          OVR_SMTP_USER: ${{ secrets.SMTP_USER }}
          OVR_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          OVR_MEILISEARCH_MASTER_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}
        run: |
          set -euo pipefail
          # Build --set-string overrides for every secret whose GitHub Secret is non-empty.
          # SOPS provides the committed baseline; GitHub Secrets take precedence when present.
          OVERRIDES=()
          for key in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB DATABASE_URL REDIS_URL \
                     SECRET_KEY ONEC_API_URL ONEC_LOGIN ONEC_PASSWORD ONEC_WEBHOOK_API_KEY \
                     YOOKASSA_SHOP_ID YOOKASSA_SECRET_KEY CDEK_ACCOUNT CDEK_SECURE \
                     YANDEX_CLIENT_ID YANDEX_CLIENT_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
                     MINIO_ACCESS_KEY MINIO_SECRET_KEY MINIO_ROOT_USER MINIO_ROOT_PASSWORD \
                     SMTP_USER SMTP_PASSWORD MEILISEARCH_MASTER_KEY; do
            var="OVR_${key}"
            val="${!var:-}"
            [ -n "$val" ] || continue
            val="${val//\\/\\\\}"   # escape backslashes for helm strvals
            val="${val//,/\\,}"     # escape commas so they aren't treated as separators
            OVERRIDES+=(--set-string "env.secrets.${key}=${val}")
          done
          helm upgrade --install promelectron ./infra/helm \
            -f infra/helm/stage/prod/values.yaml \
            -f <(sops -d infra/helm/stage/prod/secrets.yaml) \
            -f infra/helm/stage/prod/secret.yml \
            --set api.image=${{ env.API_IMAGE }}:${{ github.sha }} \
            --set frontend.image=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            "${OVERRIDES[@]}" \
            --namespace promelectron \
            --create-namespace \
            --wait \
            --wait-for-jobs
          kubectl rollout status deployment/promelectron-api -n promelectron --timeout=120s
          kubectl rollout status deployment/promelectron-frontend -n promelectron --timeout=120s

  prod-smoke:
    needs: deploy-prod
    runs-on: self-hosted
    steps:
      - name: API health check
        run: |
          curl -sf https://api.promelectron.aidrivencode.ru/health | grep -q '"status"'
          echo "API OK"

      - name: Frontend reachable
        run: |
          curl -sf -o /dev/null https://promelectron.aidrivencode.ru
          echo "Frontend OK"

