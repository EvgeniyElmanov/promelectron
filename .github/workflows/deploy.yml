name: Deploy to Kubernetes

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/helm/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Окружение для деплоя'
        required: true
        type: choice
        options:
          - test
          - prod
          - all
        default: test

env:
  REGISTRY: harbor.kubeadm.ru
  API_IMAGE: harbor.kubeadm.ru/promelectron/promelectron-api
  FRONTEND_IMAGE: harbor.kubeadm.ru/promelectron/promelectron-frontend
  KUBECONFIG_PATH: ${{ vars.KUBECONFIG_PATH }}
  SOPS_VERSION: "3.9.4"

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.REGISTRY }} \
            -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: Ensure Harbor project exists
        run: |
          curl -sf -o /dev/null \
            -u "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" \
            -X POST "https://${{ env.REGISTRY }}/api/v2.0/projects" \
            -H "Content-Type: application/json" \
            -d '{"project_name":"promelectron","public":false}' || true

      - name: Build and push API image
        run: |
          docker build -f backend/Dockerfile \
            -t ${{ env.API_IMAGE }}:${{ github.sha }} \
            backend/
          docker push ${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend (test)
        if: github.event_name == 'push' || inputs.environment == 'test' || inputs.environment == 'all'
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_URL=https://api.promelectron-test.aidrivencode.ru \
            -t ${{ env.FRONTEND_IMAGE }}-test:${{ github.sha }} \
            frontend/
          docker push ${{ env.FRONTEND_IMAGE }}-test:${{ github.sha }}

      - name: Build and push frontend (prod)
        if: inputs.environment == 'prod' || inputs.environment == 'all'
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_URL=https://api.promelectron.aidrivencode.ru \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            frontend/
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy-test:
    needs: build
    runs-on: self-hosted
    if: github.event_name == 'push' || inputs.environment == 'test' || inputs.environment == 'all'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sops
        run: |
          if ! command -v sops &>/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL -o "$HOME/.local/bin/sops" \
              "https://github.com/getsops/sops/releases/download/v${{ env.SOPS_VERSION }}/sops-v${{ env.SOPS_VERSION }}.linux.amd64"
            chmod +x "$HOME/.local/bin/sops"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Import GPG key
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf 'no-tty\npinentry-mode loopback\n' > "$GNUPGHOME/gpg.conf"
          printf 'allow-loopback-pinentry\nno-allow-external-cache\nallow-preset-passphrase\n' > "$GNUPGHOME/gpg-agent.conf"
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg-agent --daemon 2>/dev/null || true
          PRESET=$(command -v gpg-preset-passphrase 2>/dev/null \
            || find /usr/lib /usr/libexec -name gpg-preset-passphrase 2>/dev/null | head -1)
          gpg --with-keygrip --list-secret-keys \
            | awk '/Keygrip/{print $3}' \
            | while read -r grip; do
                printf '%s' "$GPG_PASSPHRASE" | "$PRESET" --preset "$grip"
              done
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Create Harbor imagePullSecret (test)
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create namespace promelectron-test --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry harborcred \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ secrets.HARBOR_USERNAME }} \
            --docker-password=${{ secrets.HARBOR_PASSWORD }} \
            --namespace promelectron-test \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to test
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          helm upgrade --install promelectron-test ./infra/helm \
            -f infra/helm/stage/test/values.yaml \
            -f <(sops -d infra/helm/stage/test/secrets.yaml) \
            --set api.image=${{ env.API_IMAGE }}:${{ github.sha }} \
            --set frontend.image=${{ env.FRONTEND_IMAGE }}-test:${{ github.sha }} \
            --set env.secrets.YANDEX_CLIENT_ID=${{ secrets.YANDEX_CLIENT_ID }} \
            --set env.secrets.YANDEX_CLIENT_SECRET=${{ secrets.YANDEX_CLIENT_SECRET }} \
            --set env.secrets.GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
            --set env.secrets.GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} \
            --namespace promelectron-test \
            --create-namespace
          kubectl rollout status deployment/promelectron-api -n promelectron-test --timeout=120s
          kubectl rollout status deployment/promelectron-frontend -n promelectron-test --timeout=120s

  test-smoke:
    needs: deploy-test
    runs-on: self-hosted
    steps:
      - name: API health check
        run: |
          curl -sf https://api.promelectron-test.aidrivencode.ru/health | grep -q '"status"'
          echo "API OK"

      - name: Frontend reachable
        run: |
          curl -sf -o /dev/null https://promelectron-test.aidrivencode.ru
          echo "Frontend OK"


  test-e2e:
    needs: test-smoke
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install chromium

      - name: Run E2E tests
        run: |
          cd frontend
          BASE_URL=https://promelectron-test.aidrivencode.ru \
          API_URL=https://api.promelectron-test.aidrivencode.ru \
            npx playwright test --reporter=html --workers=4

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-test-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 14

  deploy-prod:
    needs: [build, test-e2e]
    runs-on: self-hosted
    if: |
      always() &&
      (inputs.environment == 'prod' || inputs.environment == 'all') &&
      needs.build.result == 'success' &&
      (needs.test-e2e.result == 'success' || needs.test-e2e.result == 'skipped')
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sops
        run: |
          if ! command -v sops &>/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL -o "$HOME/.local/bin/sops" \
              "https://github.com/getsops/sops/releases/download/v${{ env.SOPS_VERSION }}/sops-v${{ env.SOPS_VERSION }}.linux.amd64"
            chmod +x "$HOME/.local/bin/sops"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Import GPG key
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf 'no-tty\npinentry-mode loopback\n' > "$GNUPGHOME/gpg.conf"
          printf 'allow-loopback-pinentry\nno-allow-external-cache\nallow-preset-passphrase\n' > "$GNUPGHOME/gpg-agent.conf"
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg-agent --daemon 2>/dev/null || true
          PRESET=$(command -v gpg-preset-passphrase 2>/dev/null \
            || find /usr/lib /usr/libexec -name gpg-preset-passphrase 2>/dev/null | head -1)
          gpg --with-keygrip --list-secret-keys \
            | awk '/Keygrip/{print $3}' \
            | while read -r grip; do
                printf '%s' "$GPG_PASSPHRASE" | "$PRESET" --preset "$grip"
              done
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Create Harbor imagePullSecret (prod)
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create namespace promelectron --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry harborcred \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ secrets.HARBOR_USERNAME }} \
            --docker-password=${{ secrets.HARBOR_PASSWORD }} \
            --namespace promelectron \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to prod
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          helm upgrade --install promelectron ./infra/helm \
            -f infra/helm/stage/prod/values.yaml \
            -f <(sops -d infra/helm/stage/prod/secrets.yaml) \
            --set api.image=${{ env.API_IMAGE }}:${{ github.sha }} \
            --set frontend.image=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            --set env.secrets.YANDEX_CLIENT_ID=${{ secrets.YANDEX_CLIENT_ID }} \
            --set env.secrets.YANDEX_CLIENT_SECRET=${{ secrets.YANDEX_CLIENT_SECRET }} \
            --set env.secrets.GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
            --set env.secrets.GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} \
            --namespace promelectron \
            --create-namespace
          kubectl rollout status deployment/promelectron-api -n promelectron --timeout=120s
          kubectl rollout status deployment/promelectron-frontend -n promelectron --timeout=120s

  prod-smoke:
    needs: deploy-prod
    runs-on: self-hosted
    steps:
      - name: API health check
        run: |
          curl -sf https://api.promelectron.aidrivencode.ru/health | grep -q '"status"'
          echo "API OK"

      - name: Frontend reachable
        run: |
          curl -sf -o /dev/null https://promelectron.aidrivencode.ru
          echo "Frontend OK"

