name: Deploy to Kubernetes

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/helm/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Окружение для деплоя'
        required: true
        type: choice
        options:
          - test
          - prod
          - all
        default: test

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/AutonomaCo/promelectron-api
  FRONTEND_IMAGE: ghcr.io/AutonomaCo/promelectron-frontend
  KUBECONFIG_PATH: ${{ vars.KUBECONFIG_PATH }}
  SOPS_VERSION: "3.9.4"

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} \
            -u "${{ github.actor }}" --password-stdin

      - name: Build and push API image
        run: |
          docker build -f backend/Dockerfile \
            -t ${{ env.API_IMAGE }}:${{ github.sha }} \
            backend/
          docker push ${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend (test)
        if: github.event_name == 'push' || inputs.environment == 'test' || inputs.environment == 'all'
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_URL=https://api.promelectron-test.aidrivencode.ru \
            --build-arg VITE_YANDEX_MAPS_API_KEY=${{ secrets.YANDEX_MAPS_API_KEY }} \
            -t ${{ env.FRONTEND_IMAGE }}-test:${{ github.sha }} \
            frontend/
          docker push ${{ env.FRONTEND_IMAGE }}-test:${{ github.sha }}

      - name: Build and push frontend (prod)
        if: inputs.environment == 'prod' || inputs.environment == 'all'
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_URL=https://api.promelectron.aidrivencode.ru \
            --build-arg VITE_YANDEX_MAPS_API_KEY=${{ secrets.YANDEX_MAPS_API_KEY }} \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            frontend/
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy-test:
    needs: build
    runs-on: self-hosted
    if: github.event_name == 'push' || inputs.environment == 'test' || inputs.environment == 'all'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sops
        run: |
          if ! command -v sops &>/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL -o "$HOME/.local/bin/sops" \
              "https://github.com/getsops/sops/releases/download/v${{ env.SOPS_VERSION }}/sops-v${{ env.SOPS_VERSION }}.linux.amd64"
            chmod +x "$HOME/.local/bin/sops"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Import GPG key
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf 'no-tty\npinentry-mode loopback\n' > "$GNUPGHOME/gpg.conf"
          printf 'allow-loopback-pinentry\nno-allow-external-cache\nallow-preset-passphrase\n' > "$GNUPGHOME/gpg-agent.conf"
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg-agent --daemon 2>/dev/null || true
          PRESET=$(command -v gpg-preset-passphrase 2>/dev/null \
            || find /usr/lib /usr/libexec -name gpg-preset-passphrase 2>/dev/null | head -1)
          gpg --with-keygrip --list-secret-keys \
            | awk '/Keygrip/{print $3}' \
            | while read -r grip; do
                printf '%s' "$GPG_PASSPHRASE" | "$PRESET" --preset "$grip"
              done
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Create imagePullSecret (test)
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create namespace promelectron-test --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry registrycred \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace promelectron-test \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to test
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
          # Optional GitHub Secrets overrides. Each is applied only when non-empty;
          # otherwise the SOPS-encrypted baseline (stage/test/secrets.yaml) is used.
          OVR_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          OVR_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          OVR_POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          OVR_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OVR_REDIS_URL: ${{ secrets.REDIS_URL }}
          OVR_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          OVR_ONEC_API_URL: ${{ secrets.ONEC_API_URL }}
          OVR_ONEC_API_KEY: ${{ secrets.ONEC_API_KEY }}
          OVR_YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          OVR_YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          OVR_CDEK_ACCOUNT: ${{ secrets.CDEK_ACCOUNT }}
          OVR_CDEK_SECURE: ${{ secrets.CDEK_SECURE }}
          OVR_YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          OVR_YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          OVR_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          OVR_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OVR_MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          OVR_MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          OVR_MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          OVR_MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          OVR_SMTP_USER: ${{ secrets.SMTP_USER }}
          OVR_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          # Build --set-string overrides for every secret whose GitHub Secret is non-empty.
          # SOPS provides the committed baseline; GitHub Secrets take precedence when present.
          OVERRIDES=()
          for key in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB DATABASE_URL REDIS_URL \
                     SECRET_KEY ONEC_API_URL ONEC_API_KEY \
                     YOOKASSA_SHOP_ID YOOKASSA_SECRET_KEY CDEK_ACCOUNT CDEK_SECURE \
                     YANDEX_CLIENT_ID YANDEX_CLIENT_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
                     MINIO_ACCESS_KEY MINIO_SECRET_KEY MINIO_ROOT_USER MINIO_ROOT_PASSWORD \
                     SMTP_USER SMTP_PASSWORD; do
            var="OVR_${key}"
            val="${!var:-}"
            [ -n "$val" ] || continue
            val="${val//\\/\\\\}"   # escape backslashes for helm strvals
            val="${val//,/\\,}"     # escape commas so they aren't treated as separators
            OVERRIDES+=(--set-string "env.secrets.${key}=${val}")
          done
          helm upgrade --install promelectron-test ./infra/helm \
            -f infra/helm/stage/test/values.yaml \
            -f <(sops -d infra/helm/stage/test/secrets.yaml) \
            --set api.image=${{ env.API_IMAGE }}:${{ github.sha }} \
            --set frontend.image=${{ env.FRONTEND_IMAGE }}-test:${{ github.sha }} \
            "${OVERRIDES[@]}" \
            --namespace promelectron-test \
            --create-namespace \
            --wait \
            --wait-for-jobs
          kubectl rollout status deployment/promelectron-api -n promelectron-test --timeout=120s
          kubectl rollout status deployment/promelectron-frontend -n promelectron-test --timeout=120s

  test-e2e:
    needs: deploy-test
    uses: ./.github/workflows/e2e.yml
    with:
      environment: test

  deploy-prod:
    needs: [build, test-e2e]
    runs-on: self-hosted
    if: |
      always() &&
      (inputs.environment == 'prod' || inputs.environment == 'all') &&
      needs.build.result == 'success' &&
      (needs.test-e2e.result == 'success' || needs.test-e2e.result == 'skipped')
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sops
        run: |
          if ! command -v sops &>/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL -o "$HOME/.local/bin/sops" \
              "https://github.com/getsops/sops/releases/download/v${{ env.SOPS_VERSION }}/sops-v${{ env.SOPS_VERSION }}.linux.amd64"
            chmod +x "$HOME/.local/bin/sops"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Import GPG key
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf 'no-tty\npinentry-mode loopback\n' > "$GNUPGHOME/gpg.conf"
          printf 'allow-loopback-pinentry\nno-allow-external-cache\nallow-preset-passphrase\n' > "$GNUPGHOME/gpg-agent.conf"
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg-agent --daemon 2>/dev/null || true
          PRESET=$(command -v gpg-preset-passphrase 2>/dev/null \
            || find /usr/lib /usr/libexec -name gpg-preset-passphrase 2>/dev/null | head -1)
          gpg --with-keygrip --list-secret-keys \
            | awk '/Keygrip/{print $3}' \
            | while read -r grip; do
                printf '%s' "$GPG_PASSPHRASE" | "$PRESET" --preset "$grip"
              done
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Create imagePullSecret (prod)
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create namespace promelectron --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry registrycred \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace promelectron \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to prod
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
          # Optional GitHub Secrets overrides. Each is applied only when non-empty;
          # otherwise the SOPS-encrypted baseline (stage/prod/secrets.yaml) is used.
          OVR_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          OVR_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          OVR_POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          OVR_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OVR_REDIS_URL: ${{ secrets.REDIS_URL }}
          OVR_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          OVR_ONEC_API_URL: ${{ secrets.ONEC_API_URL }}
          OVR_ONEC_API_KEY: ${{ secrets.ONEC_API_KEY }}
          OVR_YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          OVR_YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          OVR_CDEK_ACCOUNT: ${{ secrets.CDEK_ACCOUNT }}
          OVR_CDEK_SECURE: ${{ secrets.CDEK_SECURE }}
          OVR_YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          OVR_YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          OVR_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          OVR_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OVR_MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          OVR_MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          OVR_MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          OVR_MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          OVR_SMTP_USER: ${{ secrets.SMTP_USER }}
          OVR_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          # Build --set-string overrides for every secret whose GitHub Secret is non-empty.
          # SOPS provides the committed baseline; GitHub Secrets take precedence when present.
          OVERRIDES=()
          for key in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB DATABASE_URL REDIS_URL \
                     SECRET_KEY ONEC_API_URL ONEC_API_KEY \
                     YOOKASSA_SHOP_ID YOOKASSA_SECRET_KEY CDEK_ACCOUNT CDEK_SECURE \
                     YANDEX_CLIENT_ID YANDEX_CLIENT_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
                     MINIO_ACCESS_KEY MINIO_SECRET_KEY MINIO_ROOT_USER MINIO_ROOT_PASSWORD \
                     SMTP_USER SMTP_PASSWORD; do
            var="OVR_${key}"
            val="${!var:-}"
            [ -n "$val" ] || continue
            val="${val//\\/\\\\}"   # escape backslashes for helm strvals
            val="${val//,/\\,}"     # escape commas so they aren't treated as separators
            OVERRIDES+=(--set-string "env.secrets.${key}=${val}")
          done
          helm upgrade --install promelectron ./infra/helm \
            -f infra/helm/stage/prod/values.yaml \
            -f <(sops -d infra/helm/stage/prod/secrets.yaml) \
            --set api.image=${{ env.API_IMAGE }}:${{ github.sha }} \
            --set frontend.image=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            "${OVERRIDES[@]}" \
            --namespace promelectron \
            --create-namespace \
            --wait \
            --wait-for-jobs
          kubectl rollout status deployment/promelectron-api -n promelectron --timeout=120s
          kubectl rollout status deployment/promelectron-frontend -n promelectron --timeout=120s

  prod-smoke:
    needs: deploy-prod
    runs-on: self-hosted
    steps:
      - name: API health check
        run: |
          curl -sf https://api.promelectron.aidrivencode.ru/health | grep -q '"status"'
          echo "API OK"

      - name: Frontend reachable
        run: |
          curl -sf -o /dev/null https://promelectron.aidrivencode.ru
          echo "Frontend OK"

