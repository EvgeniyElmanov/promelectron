name: Deploy MyShop

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Окружение для деплоя'
        required: true
        type: choice
        options:
          - test
          - prod
        default: test

env:
  REGISTRY: harbor.kubeadm.ru
  API_IMAGE: harbor.kubeadm.ru/promelectron/myshop-api
  FRONTEND_IMAGE: harbor.kubeadm.ru/promelectron/myshop-frontend
  KUBECONFIG_PATH: ${{ vars.KUBECONFIG_PATH }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Validate Helm charts
        run: |
          helm lint ./infra/helm
          helm template myshop-test ./infra/helm > /dev/null

      - name: Validate Dockerfiles syntax
        run: |
          docker run --rm -i hadolint/hadolint < Dockerfile.backend || true
          docker run --rm -i hadolint/hadolint < Dockerfile.frontend || true

      - name: Summary
        run: echo "✅ Infra validation passed"

  build:
    needs: validate
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.REGISTRY }} \
            -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: Build and push API image
        run: |
          docker build -f Dockerfile.backend \
            -t ${{ env.API_IMAGE }}:${{ github.sha }} \
            .
          docker push ${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        run: |
          docker build -f Dockerfile.frontend \
            --build-arg VITE_API_URL=https://api.promelectron-test.aidrivencode.ru \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            .
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy-test:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix namespace ownership for Helm
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          if kubectl get namespace myshop-test &>/dev/null; then
            echo "Namespace exists, ensuring Helm ownership labels..."
            kubectl label namespace myshop-test app.kubernetes.io/managed-by=Helm --overwrite
            kubectl annotate namespace myshop-test meta.helm.sh/release-name=myshop-test --overwrite
            kubectl annotate namespace myshop-test meta.helm.sh/release-namespace=myshop-test --overwrite
          fi

      - name: Create Harbor imagePullSecret
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create secret docker-registry harborcred \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ secrets.HARBOR_USERNAME }} \
            --docker-password=${{ secrets.HARBOR_PASSWORD }} \
            --namespace myshop-test \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Check prerequisites
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          echo "=== Secrets ==="
          kubectl get secrets -n myshop-test || true
          echo ""
          echo "=== PostgreSQL Pod ==="
          kubectl get pods -n myshop-test -l app=myshop-test-postgresql || true
          echo ""
          echo "=== Previous API Pod Status ==="
          kubectl get pods -n myshop-test -l app=myshop-test-api || true

      - name: Deploy to test
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          helm upgrade --install myshop-test ./infra/helm \
            --set api.image=${{ env.API_IMAGE }}:${{ github.sha }} \
            --set frontend.image=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            --namespace myshop-test \
            --create-namespace
          echo ""
          echo "=== Pods after deploy ==="
          kubectl get pods -n myshop-test
          echo ""
          echo "=== API Pod describe ==="
          kubectl describe pods -n myshop-test -l app=myshop-test-api | head -40

      - name: Wait for API rollout
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          echo "Checking API pod status..."
          kubectl get pods -n myshop-test -l app=myshop-test-api
          
          # If pod is in CrashLoopBackOff, show logs immediately
          if kubectl get pods -n myshop-test -l app=myshop-test-api | grep -q CrashLoopBackOff; then
            echo "=== API Pod is in CrashLoopBackOff ==="
            kubectl logs -n myshop-test -l app=myshop-test-api --tail=100 || true
            kubectl describe pods -n myshop-test -l app=myshop-test-api | grep -A 10 "Events:" || true
            exit 1
          fi
          
          kubectl rollout status deployment/myshop-api -n myshop-test --timeout=300s || {
            echo "=== API Pod Logs ==="
            kubectl logs -n myshop-test -l app=myshop-test-api --tail=100 || true
            echo "=== API Pod Events ==="
            kubectl get events -n myshop-test --field-selector reason=Failed --sort-by='.lastTimestamp' | tail -20 || true
            echo "=== API Pod Describe ==="
            kubectl describe pods -n myshop-test -l app=myshop-test-api | tail -30 || true
            exit 1
          }

      - name: Wait for frontend rollout
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          echo "Checking frontend pod status..."
          kubectl get pods -n myshop-test -l app=myshop-test-frontend
          
          if kubectl get pods -n myshop-test -l app=myshop-test-frontend | grep -q CrashLoopBackOff; then
            echo "=== Frontend Pod is in CrashLoopBackOff ==="
            kubectl logs -n myshop-test -l app=myshop-test-frontend --tail=50 || true
            exit 1
          fi
          
          kubectl rollout status deployment/myshop-frontend -n myshop-test --timeout=300s || {
            echo "=== Frontend Pod Logs ==="
            kubectl logs -n myshop-test -l app=myshop-test-frontend --tail=50 || true
            exit 1
          }

  test-smoke:
    needs: deploy-test
    runs-on: self-hosted
    steps:
      - name: API health check
        run: |
          curl -sf https://api.promelectron-test.aidrivencode.ru/health | grep -q '"status"'
          echo "API OK"

      - name: Frontend reachable
        run: |
          curl -sf -o /dev/null https://promelectron-test.aidrivencode.ru
          echo "Frontend OK"
