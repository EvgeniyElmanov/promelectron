name: Deploy MyShop

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Окружение для деплоя'
        required: true
        type: choice
        options:
          - test
          - prod
        default: test

env:
  REGISTRY: harbor.kubeadm.ru
  API_IMAGE: harbor.kubeadm.ru/promelectron/myshop-api
  FRONTEND_IMAGE: harbor.kubeadm.ru/promelectron/myshop-frontend
  KUBECONFIG_PATH: ${{ vars.KUBECONFIG_PATH }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend tests
        run: pytest tests/ -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        run: |
          cd client
          npm ci

      - name: Run frontend tests
        run: |
          cd client
          npm run test

  build:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.REGISTRY }} \
            -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: Build and push API image
        run: |
          docker build -f Dockerfile.backend \
            -t ${{ env.API_IMAGE }}:${{ github.sha }} \
            .
          docker push ${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        run: |
          docker build -f Dockerfile.frontend \
            --build-arg VITE_API_URL=https://api.promelectron-test.aidrivencode.ru \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            .
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy-test:
    needs: build
    runs-on: self-hosted
    if: github.event_name == 'push' || inputs.environment == 'test'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Harbor imagePullSecret
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl create namespace myshop-test --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry harborcred \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ secrets.HARBOR_USERNAME }} \
            --docker-password=${{ secrets.HARBOR_PASSWORD }} \
            --namespace myshop-test \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to test
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          helm upgrade --install myshop-test ./infra/helm \
            --set api.image=${{ env.API_IMAGE }}:${{ github.sha }} \
            --set frontend.image=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            --namespace myshop-test \
            --create-namespace
          kubectl rollout status deployment/myshop-api -n myshop-test --timeout=120s
          kubectl rollout status deployment/myshop-frontend -n myshop-test --timeout=120s

  test-smoke:
    needs: deploy-test
    runs-on: self-hosted
    steps:
      - name: API health check
        run: |
          curl -sf https://api.promelectron-test.aidrivencode.ru/health | grep -q '"status"'
          echo "API OK"

      - name: Frontend reachable
        run: |
          curl -sf -o /dev/null https://promelectron-test.aidrivencode.ru
          echo "Frontend OK"
