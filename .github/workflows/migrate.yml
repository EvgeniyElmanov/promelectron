name: Run Database Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Окружение'
        required: true
        type: choice
        options:
          - test
          - prod
      action:
        description: 'Действие'
        required: true
        type: choice
        options:
          - upgrade head
          - downgrade -1
          - current
          - history
          - check

env:
  KUBECONFIG_PATH: ${{ vars.KUBECONFIG_PATH }}

jobs:
  migrate:
    runs-on: self-hosted
    steps:
      - name: Set namespace
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "NAMESPACE=promelectron" >> $GITHUB_ENV
          else
            echo "NAMESPACE=promelectron-test" >> $GITHUB_ENV
          fi

      - name: Wait for API deployment
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl rollout status deployment/promelectron-api \
            -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Run alembic ${{ inputs.action }}
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=promelectron-api \
            -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$POD" ]; then
            echo "ERROR: No promelectron-api pod found in ${{ env.NAMESPACE }}"
            exit 1
          fi
          echo "Running: alembic ${{ inputs.action }} on $POD in ${{ env.NAMESPACE }}"
          kubectl exec -n ${{ env.NAMESPACE }} $POD -- \
            alembic ${{ inputs.action }}
