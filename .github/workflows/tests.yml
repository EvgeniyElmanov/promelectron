name: Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/helm/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  workflow_call:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker info
        run: docker info && docker compose version

      - name: Build backend image
        run: docker compose -f backend/docker-compose.yml -p promelectron build api

      - name: Run backend tests
        run: make test-backend

      - name: Run backend lint
        run: make lint-backend

      - name: Dump backend service logs on failure
        if: failure()
        run: docker compose -f backend/docker-compose.yml -p promelectron logs --tail=200

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run frontend tests
        run: make test-frontend-ci

      - name: Run frontend lint
        run: make lint-frontend

      - name: Dump frontend service logs on failure
        if: failure()
        run: docker compose -f frontend/docker-compose.yml -p promelectron logs --tail=200
