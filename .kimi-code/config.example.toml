# Example user-level Kimi Code CLI config for Promelectron.
# Copy relevant sections into ~/.kimi-code/config.toml
# Project-level config.toml is NOT supported by Kimi Code CLI.

default_model = "kimi-for-coding"
default_thinking = true
default_permission_mode = "manual"
# default_permission_mode = "auto"   # разрешить read-only автоматически; править/запускать — всё ещё с approval
# default_permission_mode = "yolo"   # только для локальных экспериментов; пропускает approval почти всех инструментов
default_plan_mode = false
merge_all_available_skills = true
telemetry = true

# NOTE: There is no "default_yolo" field in Kimi Code CLI.
# Use default_permission_mode = "manual" | "auto" | "yolo" instead.

# Kimi K3 specifics:
# - Context window: 1M tokens (1,048,576).
# - Thinking mode is enabled by default; control depth via
#   reasoning_effort = "low" | "high" | "max" (default "max").
#   Do not disable thinking: disabling it silently switches the model to
#   K2.8 Preview without thinking.
# - The CLI preserves reasoning across turns automatically ([thinking] keep,
#   default on); no manual reasoning_content handling is needed.
# - Automatic prefix caching: keep the stable part of subagent prompts at the front.
# - Project retry policy: transient errors (502/504/timeout) are retried up to 4
#   attempts (3 retries) with exponential backoff via scripts/agent_retry.py.

# ─── Provider & Model ───
# Alias for Kimi Code managed provider. Uncomment and fill api_key if you use API key login.

[providers."managed:kimi-code"]
type = "kimi"
base_url = "https://api.kimi.com/coding/v1"
api_key = ""

[models."kimi-for-coding"]
provider = "managed:kimi-code"
model = "kimi-for-coding"
max_context_size = 1048576

# Direct Kimi API (OpenAI-compatible). Use this for third-party agent frameworks
# or when you manage the API key manually.
# [providers."moonshot"]
# type = "openai"
# base_url = "https://api.moonshot.ai/v1"
# api_key = ""

# Direct Kimi API (OpenAI-compatible) highspeed variant:
# [models."kimi-k3-highspeed"]
# provider = "moonshot"
# model = "kimi-k3-highspeed"
# max_context_size = 262144

# ─── Permission Rules for /skill:implement pipeline ───
# These rules reduce approval friction for git worktrees, tests, and lint.
# You can also use interactive slash commands: /yolo (auto-approve) or /afk.

[[permission.rules]]
decision = "allow"
pattern = "Bash(git worktree *)"
reason = "Allow /skill:implement to create isolated worktrees"

[[permission.rules]]
decision = "ask"
pattern = "Bash(git commit *)"
reason = "Commit only after explicit user approval and only on feature branches (AGENTS.md hard rule)"

[[permission.rules]]
decision = "ask"
pattern = "Bash(git merge *)"
reason = "Merge only after explicit user approval (AGENTS.md hard rule)"

[[permission.rules]]
decision = "allow"
pattern = "Bash(git branch *)"
reason = "Allow branch cleanup and inspection during worktree lifecycle"

[[permission.rules]]
decision = "allow"
pattern = "Bash(git diff *)"
reason = "Allow reviewer to inspect changes"

[[permission.rules]]
decision = "allow"
pattern = "Bash(git status *)"
reason = "Allow agents to check git status"

[[permission.rules]]
decision = "allow"
pattern = "Bash(git push origin feature/*)"
reason = "Push feature branches to origin"

[[permission.rules]]
decision = "allow"
pattern = "Bash(git push origin bugfix/*)"
reason = "Push bugfix branches to origin"

[[permission.rules]]
decision = "ask"
pattern = "Bash(git push origin main)"
reason = "Push main only after explicit user approval"

[[permission.rules]]
decision = "allow"
pattern = "Bash(gh pr create *)"
reason = "Create GitHub Pull Requests from feature branches"

[[permission.rules]]
decision = "allow"
pattern = "Bash(make test-backend)"
reason = "Run backend tests in Docker"

[[permission.rules]]
decision = "allow"
pattern = "Bash(make test-frontend)"
reason = "Run frontend unit tests"

[[permission.rules]]
decision = "allow"
pattern = "Bash(make test-e2e)"
reason = "Run Playwright E2E tests"

[[permission.rules]]
decision = "allow"
pattern = "Bash(ruff check *)"
reason = "Lint Python code"

[[permission.rules]]
decision = "allow"
pattern = "Bash(npm run lint)"
reason = "Lint frontend code"

[[permission.rules]]
decision = "allow"
pattern = "Bash(npx playwright test *)"
reason = "Run Playwright tests"

[[permission.rules]]
decision = "allow"
pattern = "Bash(alembic *)"
reason = "Run Alembic migrations"

# ─── Hooks ───
# NOTE: ~/.kimi-code/config.toml is user-level, so hooks run for EVERY project.
# Avoid project-specific commands (like "cd backend && ruff check") here.
# Use project-level lint scripts (e.g. make lint / pre-push hook) instead.
#
# Hooks receive event JSON via stdin and decide whether to allow/block a tool call
# based on exit code: 0 = allow, 2 = block, anything else = allow (fail-open).

# Block dangerous shell commands before execution.
# The hook script lives in the repo at scripts/hooks/block-dangerous-bash.py.
# Copy it to ~/.kimi-code/hooks/block-dangerous-bash.py when copying this config.
[[hooks]]
event = "PreToolUse"
matcher = "Bash"
command = "python3 ~/.kimi-code/hooks/block-dangerous-bash.py"
timeout = 5

# Block git commit/push/merge on the main branch (works in worktrees too;
# fail-open outside git repos). Repo: scripts/hooks/block-main-git-mutations.py.
[[hooks]]
event = "PreToolUse"
matcher = "Bash"
command = "python3 ~/.kimi-code/hooks/block-main-git-mutations.py"
timeout = 5

# Block make test-backend/test-frontend while another backend test run holds
# the Makefile flock (template DB race, LESSONS_LEARNED 2026-08-01; fail-open
# for projects without the lock). Repo: scripts/hooks/single-test-run.py.
[[hooks]]
event = "PreToolUse"
matcher = "Bash"
command = "python3 ~/.kimi-code/hooks/single-test-run.py"
timeout = 5

# Notify when a background task completes (safe for any project).
